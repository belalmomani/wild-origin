name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot templates + Android settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ "$HOME" != "/root" ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOS
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

      - name: Unit checks (non-blocking until verified on a real run)
        continue-on-error: true
        run: godot --headless --script tests/run_tests.gd

      - name: Import project
        run: godot --headless --import || true

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android Debug" build/wild-origin-debug.apk
          test -s build/wild-origin-debug.apk && ls -l build/

      - name: Export release APK (only if signing secrets exist)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /root/release.keystore
          godot --headless --verbose --export-release "Android Release" build/wild-origin-release.apk
          test -s build/wild-origin-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wild-origin-apk
          path: build/*.apk
          if-no-files-found: error
