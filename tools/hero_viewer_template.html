<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>المستكشف — Hero Viewer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9db4c8;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #scope{position:fixed;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 41%,rgba(0,0,0,.55) 45%,#000 47%)}
  #scope::before,#scope::after{content:"";position:absolute;background:rgba(235,235,235,.9)}
  #scope::before{left:50%;top:8%;bottom:8%;width:1.5px}
  #scope::after{top:50%;left:20%;right:20%;height:1.5px}
  #hud{position:fixed;top:8px;left:10px;max-width:calc(100% - 150px);font-size:12px;opacity:.9;text-shadow:0 1px 2px #000;white-space:pre-wrap;pointer-events:none}
  #err{position:fixed;top:0;left:0;right:0;background:#b00020;color:#fff;padding:8px 12px;font-size:13px;display:none;z-index:99;direction:ltr;white-space:pre-wrap}
  #panelBtn{position:fixed;top:8px;right:10px;z-index:20;background:#1b2a1e;border:1px solid #fff4;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px}
  #panel{position:fixed;top:48px;right:8px;bottom:8px;width:min(330px,92vw);overflow:auto;background:#0f1a12ee;border:1px solid #fff3;border-radius:12px;padding:10px;z-index:15;display:none;font-size:13px}
  #panel h3{margin:10px 0 6px;font-size:13px;color:#e8b06a;border-bottom:1px solid #fff2;padding-bottom:3px}
  .row{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
  button.b{background:#24402b;border:1px solid #fff3;color:#fff;border-radius:7px;padding:7px 9px;font-size:13px}
  button.b.on{background:#c97a2b;border-color:#fff8}
  label.sl{display:flex;align-items:center;gap:6px;margin:3px 0}
  label.sl span{min-width:78px}
  label.sl input[type=range]{flex:1}
  .col{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
  .col label{display:flex;align-items:center;gap:6px;font-size:12px}
  input[type=color]{width:34px;height:24px;border:0;padding:0;background:none}
  #stick{position:fixed;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff5;z-index:10}
  #knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#fffa}
  #jump{position:fixed;right:20px;bottom:30px;width:84px;height:84px;border-radius:50%;background:#c97a2bcc;border:2px solid #fff8;color:#fff;font-size:15px;z-index:10}
  #help{font-size:11px;opacity:.8;line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<div id="err"></div>
<div id="app"></div>
<div id="scope"></div>
<div id="hud"></div>
<button id="panelBtn">⚙ التحكم</button>
<div id="panel"></div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">قفز</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* =====================================================================================
   المستكشف — صفحة عرض وتحرير الشخصية (Three.js)
   كل شيء قابل للتعديل: ابدأ من CONFIG ثم قسم الحركة (PoseEngine) ثم الأسلحة (WEAPONS).
   النموذج مضمَّن في آخر الملف (hero-glb). يمكنك أيضًا تحميل أي GLB بنفس أسماء العظام من اللوحة.
   ===================================================================================== */

/* ------------------------------- 1) الإعدادات ------------------------------------- */
const CONFIG = {
  heightScale: 1.0,          // تكبير الشخصية كلها طوليًا
  widthScale: 1.0,           // تكبير العرض (الكتفان والجذع...)
  walkSpeed: 3.0,            // سرعة المشي بالكيبورد (م/ث)
  runSpeed: 6.0,             // سرعة الجري (م/ث) = أقصى سرعة للعصا
  crouchSpeed: 2.0,
  gravity: 18.0, jumpSpeed: 6.0,
  autoFace: true,            // تعابير تلقائية (تركيز عند التصويب، دهشة عند السقوط، تعب بعد جري طويل)
  detailDistance: 14,        // شبكة التفاصيل (درزات وإبزيم) تختفي بعد هذه المسافة
  camera: { fov: 50, distance: 3.4, height: 1.2 },
  // ألوان ابتدائية اختيارية، مثال: { shirt:'#1f3a22', pants:'#6a6a45' } (اتركها فارغة لاستعمال ألوان الملف)
  colors: {}
};

/* ------------------------------- 2) محرك الحركة ----------------------------------- */
// BEGIN POSE
// الدوران بإطار الشخصية (الوجه = -Z): x موجب = تأرجح الطرف للأمام. يُحوَّل لاحقًا إلى إطار النموذج.
const JOINTS = ["hips","spine","chest","head","shL","shR","elL","elR","hipL","hipR","knL","knR"];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const vlerp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const pow0=(x,e)=>Math.pow(Math.max(0,x),e);

class PoseEngine{
  constructor(){
    this.t=0; this.phase=0; this.walkW=0; this.prevCs=1;
    this.wasAir=false; this.airVy=0; this.landT=0; this.landAmp=0;
    this.actionT=0; this.lastAction=""; this.hipsY=0.95; this.anL=0; this.anR=0;
    this.rot={}; JOINTS.forEach(j=>this.rot[j]=[0,0,0]);
    this.events=[];            // 'step' عند ملامسة القدم / الهبوط
  }
  /* s = {spd, onFloor, vy, crouch, action:'' | chop | gather | build | aim, carrying, turn, weapon} */
  update(d, s){
    let spd=s.spd; const {onFloor,vy,crouch,action,carrying,turn,weapon}=s;
    this.t+=d;
    if(onFloor && spd<0.5 && Math.abs(turn)>1.0 && action==="") spd=0.8*clamp(Math.abs(turn)/3,0.3,1); // دوران في المكان بخطوات صغيرة
    if(action!==this.lastAction){this.actionT=0;this.lastAction=action}
    this.actionT+=d;
    const t=this.t, k=clamp(d*14,0,1);
    const amp=clamp(spd/6,0,1), tRun=clamp((spd-1.6)/4.2,0,1);
    const stride=lerp(0.62,1.25,amp);
    this.phase+=d*spd/stride*Math.PI;                      // خطوة لكل π: سرعة القدم = سرعة الأرض (بلا انزلاق)
    const sw=Math.sin(this.phase), cs=Math.cos(this.phase);
    let hipY=0.95;
    const wt=onFloor?clamp((spd-0.2)/1.0,0,1):0;
    this.walkW=lerp(this.walkW,wt,clamp(d*8,0,1));
    if(onFloor && this.walkW>0.4 && cs*this.prevCs<0) this.events.push("step");
    this.prevCs=cs;
    const tg={}; JOINTS.forEach(j=>tg[j]=[0,0,0]);
    // --- وقوف مقابل مشي/جري (مزج تدريجي) ---
    const shift=Math.sin(t*0.45);
    const idle={
      spine:[Math.sin(t*1.6)*0.012,0,shift*0.02], head:[Math.sin(t*0.7)*0.03,Math.sin(t*0.45)*0.1,-shift*0.02],
      hips:[0,0,shift*0.025], hipL:[0,0,-0.045], hipR:[0,0,0.045],
      knL:[-0.05*Math.max(0,shift),0,0], knR:[-0.05*Math.max(0,-shift),0,0],
      shL:[0.03,0,0.09+Math.sin(t*1.6)*0.012], shR:[0.03,0,-0.09-Math.sin(t*1.6)*0.012], elL:[0.18,0,0], elR:[0.18,0,0]};
    const A=lerp(0.28,0.42,clamp(spd/2.2,0,1))+0.33*tRun, K=0.9+0.6*tRun, arm=0.30+0.35*tRun, tw=0.5+tRun, el=0.22+1.0*tRun;
    const walk={
      hipL:[sw*A,0,0], hipR:[-sw*A,0,0],
      knL:[-(0.08+K*pow0(cs,1.4)+0.14*pow0(sw,2)),0,0], knR:[-(0.08+K*pow0(-cs,1.4)+0.14*pow0(-sw,2)),0,0],
      shL:[-sw*arm-0.04,0,0.05], shR:[sw*arm-0.04,0,-0.05],
      elL:[el+(0.25+0.4*tRun)*Math.max(0,-sw),0,0], elR:[el+(0.25+0.4*tRun)*Math.max(0,sw),0,0],
      hips:[0,sw*0.10*tw,0], spine:[-(0.03+0.2*tRun),-sw*0.08*tw,0], head:[0.03+0.15*tRun,sw*0.03,0]};
    for(const key in walk) tg[key]=vlerp(idle[key]||[0,0,0],walk[key],this.walkW);
    for(const key in idle) if(!(key in walk)) tg[key]=idle[key];
    hipY=lerp(0.95+Math.sin(t*1.6)*0.004, 0.95-(0.02+0.035*tRun)*(1-Math.abs(cs)), this.walkW);
    // --- قفز: صعود/هبوط ممزوجان بالسرعة الرأسية + امتصاص الهبوط ---
    if(!onFloor){
      this.wasAir=true; this.airVy=Math.min(this.airVy,vy);
      const up=clamp(vy/5,0,1);
      tg.hipL=vlerp([0.35,0,0],[0.7,0,0],up); tg.hipR=vlerp([-0.25,0,0],[-0.2,0,0],up);
      tg.knL=vlerp([-0.7,0,0],[-1.1,0,0],up); tg.knR=vlerp([-0.4,0,0],[-0.5,0,0],up);
      tg.shL=vlerp([1.0,0,0.55],[2.2,0,0.3],up); tg.shR=vlerp([1.0,0,-0.55],[2.2,0,-0.3],up);
      tg.elL=[0.25,0,0]; tg.elR=[0.25,0,0]; tg.spine=vlerp([-0.05,0,0],[-0.12,0,0],up);
    }else if(this.wasAir){
      this.wasAir=false; this.landAmp=clamp(-this.airVy/9,0.25,1); this.landT=1; this.airVy=0; this.events.push("step");
    }
    this.landT=Math.max(0,this.landT-d*3);
    if(this.landT>0 && onFloor && action===""){
      const lw=this.landT*this.landAmp;
      tg.hipL=vadd(tg.hipL,[0.55*lw,0,0]); tg.hipR=vadd(tg.hipR,[0.55*lw,0,0]);
      tg.knL=vadd(tg.knL,[-1.0*lw,0,0]); tg.knR=vadd(tg.knR,[-1.0*lw,0,0]);
      tg.spine=vadd(tg.spine,[-0.2*lw,0,0]);
      tg.shL=vadd(tg.shL,[0.4*lw,0,0.1*lw]); tg.shR=vadd(tg.shR,[0.4*lw,0,-0.1*lw]);
      hipY-=0.10*lw;
    }
    // --- انحناء ---
    if(crouch && onFloor){
      hipY=0.62;
      tg.hipL=[1.25+sw*0.25*amp,0,0]; tg.hipR=[1.25-sw*0.25*amp,0,0]; tg.knL=[-2.15,0,0]; tg.knR=[-2.15,0,0];
      tg.spine=[-0.4,0,0]; tg.head=[0.35,0,0]; tg.shL=[0.5,0,0.1]; tg.shR=[0.5,0,-0.1]; tg.elL=[0.7,0,0]; tg.elR=[0.7,0,0];
    }
    // --- حمل حجر ---
    if(carrying && action===""){
      tg.shL=[1.1,0,0.3]; tg.shR=[1.1,0,-0.3]; tg.elL=[1.55,0,0]; tg.elR=[1.55,0,0]; tg.spine=[0.1-0.1*amp,0,0];
    }
    // --- حركات العمل والتصويب ---
    switch(action){
      case "chop":{
        const p=((this.actionT*1.5)%1+1)%1;
        const swing=smoothstep(0,0.55,p)*(1-smoothstep(0.55,0.72,p));
        const a=lerp(0.35,2.6,swing);
        tg.shL=[a,0,0.18]; tg.shR=[a,0,-0.18]; tg.elL=[lerp(0.9,0.6,swing),0,0]; tg.elR=[lerp(0.9,0.6,swing),0,0];
        tg.spine=[lerp(-0.45,0.2,swing),0.2,0]; tg.hipL=[0.35,0,0]; tg.hipR=[-0.25,0,0]; tg.knL=[-0.45,0,0]; tg.knR=[-0.3,0,0]; hipY=0.9; break;}
      case "gather":{
        hipY=0.6; tg.hipL=[1.3,0,0]; tg.hipR=[1.3,0,0]; tg.knL=[-2.2,0,0]; tg.knR=[-2.2,0,0]; tg.spine=[-0.85,0,0]; tg.head=[0.6,0,0];
        const dig=Math.sin(this.actionT*8)*0.25;
        tg.shL=[1.25+dig,0,0.12]; tg.shR=[1.25-dig,0,-0.12]; tg.elL=[0.45,0,0]; tg.elR=[0.45,0,0]; break;}
      case "aim":{
        tg.hipL=[0.2,0,0]; tg.hipR=[-0.2,0,0];
        if(weapon==="bow"){           // اليسرى تمسك القوس واليمنى تشدّ الوتر
          tg.shL=[1.55,0,0.1]; tg.elL=[0.12,0,0]; tg.shR=[1.2,0,0.55]; tg.elR=[2.35,0,0]; tg.spine=[-0.04,0,0]; tg.head=[0,-0.25,0];
        }else if(weapon==="crossbow"){ // يدان على الجذع
          tg.shL=[1.45,0,0.14]; tg.elL=[0.5,0,0]; tg.shR=[1.5,0,-0.12]; tg.elR=[0.35,0,0]; tg.spine=[-0.05,0,0]; tg.head=[0.05,0,0];
        }else{                         // مقلاع: اليمنى تمسك الشوكة واليسرى تشدّ المطاط
          tg.shR=[1.55,0,-0.08]; tg.elR=[0.1,0,0]; tg.shL=[1.15,0,0.3]; tg.elL=[2.15,0,0]; tg.spine=[-0.04,0.25,0]; tg.head=[0,-0.25,0];
        } break;}
      case "build":{
        hipY=0.55; tg.hipR=[1.35,0,0]; tg.knR=[-1.45,0,0]; tg.hipL=[0.2,0,0]; tg.knL=[-2.3,0,0]; tg.spine=[-0.6,0,0]; tg.head=[0.4,0,0];
        const pat=Math.sin(this.actionT*6)*0.18;
        tg.shL=[1.25+pat,0,0.15]; tg.shR=[1.25-pat,0,-0.15]; tg.elL=[0.7,0,0]; tg.elR=[0.7,0,0]; break;}
    }
    // --- ميل داخل المنعطف ---
    if(action==="" && onFloor){
      const lean=clamp(turn*0.035,-0.12,0.12);
      tg.spine=vadd(tg.spine,[0,0,lean]); tg.hips=vadd(tg.hips,[0,0,-lean*0.5]); tg.head=vadd(tg.head,[0,clamp(turn*0.03,-0.15,0.15),0]);
    }
    for(const j of JOINTS) this.rot[j]=vlerp(this.rot[j],tg[j],k);
    this.hipsY=lerp(this.hipsY,hipY,k);
    // القدم مسطحة: الكاحل يعوّض الفخذ والساق + رفع الأصابع عند الدفع / الكعب عند الملامسة
    for(const side of ["L","R"]){
      const h=this.rot["hip"+side], kn=this.rot["kn"+side], sgn=side==="L"?1:-1;
      const behind=Math.max(0,-sw*sgn), ahead=Math.max(0,sw*sgn);
      this["an"+side]=clamp(-(h[0]+kn[0])*0.8-0.35*behind*this.walkW+0.14*Math.pow(ahead,3)*this.walkW,-0.9,0.9);
    }
    return this;
  }
}
// END POSE

// BEGIN IK
// حل رياضي لذراع من عظمتين: الكتف S → الكوع E → المعصم W بحيث يصل المعصم إلى الهدف T (مصفوفات [x,y,z]).
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul3=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], len3=a=>Math.hypot(a[0],a[1],a[2]), nrm3=a=>{const l=len3(a)||1;return [a[0]/l,a[1]/l,a[2]/l]};
function solveElbow(S,T,L1,L2,pole){
  const d=sub3(T,S); const dist=clamp(len3(d),Math.abs(L1-L2)*1.001+1e-3,(L1+L2)*0.999);
  const u=nrm3(d), W=add3(S,mul3(u,dist));
  const a=(L1*L1-L2*L2+dist*dist)/(2*dist), h=Math.sqrt(Math.max(0,L1*L1-a*a));
  let p=sub3(pole,mul3(u,dot3(pole,u))); if(len3(p)<1e-6)p=[0,-1,0]; p=nrm3(p);
  return {E:add3(add3(S,mul3(u,a)),mul3(p,h)),W};
}
// END IK

/* ------------------------------- 3) المشهد والتحميل ------------------------------- */
const $=s=>document.querySelector(s);
function showErr(m){const e=$("#err");e.style.display="block";e.textContent=String(m);console.error(m)}
window.addEventListener("error",ev=>showErr("خطأ: "+ev.message));
window.addEventListener("unhandledrejection",ev=>showErr("خطأ: "+(ev.reason&&ev.reason.message||ev.reason)));

let renderer,scene,camera,controls,clock,root,model,skeleton,bones={},headMesh,detailMesh,restHipsY=0.92;
let engine=new PoseEngine();
const state={action:"",crouch:false,carrying:false,weapon:"slingshot",scope:false,autoFace:CONFIG.autoFace,
  emote:"",emoteT:0,faceManual:{smile:0,surprise:0,focus:0,fear:0,tired:0},
  pos:new THREE.Vector3(),vy:0,heading:0,turnS:0,speed:0,runT:0,input:{x:0,y:0},shift:false,
  packX:0,packV:0,prevVy:0,exprCur:{},scopeYaw:0,scopePitch:0};
const FACES=["smile","surprise","focus","fear","tired"];
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

function init(){
  if(typeof THREE==="undefined"||!THREE.GLTFLoader){showErr("تعذّر تحميل مكتبات Three.js من الإنترنت. افتح الصفحة مع اتصال بالشبكة.");return}
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  $("#app").appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x9db4c8); scene.fog=new THREE.Fog(0x9db4c8,18,60);
  camera=new THREE.PerspectiveCamera(CONFIG.camera.fov,1,0.05,200);
  camera.position.set(0,CONFIG.camera.height,CONFIG.camera.distance);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.target.set(0,1.0,0); controls.enablePan=false; controls.minDistance=0.8; controls.maxDistance=12; controls.maxPolarAngle=Math.PI*0.52;
  scene.add(new THREE.HemisphereLight(0xdfeaff,0x4a5a3a,0.9));
  const sun=new THREE.DirectionalLight(0xfff1dd,1.35); sun.position.set(4,8,5); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-4;sc.right=4;sc.top=4;sc.bottom=-4;sc.near=1;sc.far=25; sun.shadow.bias=-0.0004;
  scene.add(sun); scene.add(sun.target); state.sun=sun;
  const ground=new THREE.Mesh(new THREE.CircleGeometry(60,64),new THREE.MeshStandardMaterial({color:0x5c7a3a,roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  const grid=new THREE.GridHelper(60,60,0x2f4a22,0x44622f); grid.position.y=0.01; grid.material.opacity=0.35; grid.material.transparent=true; scene.add(grid);
  clock=new THREE.Clock(); onResize(); addEventListener("resize",onResize);
  buildPanel(); bindInput();
  try{ loadModel(b64ToBuffer($("#hero-glb").textContent.trim())); }catch(e){showErr(e)}
  renderer.setAnimationLoop(frame);
}
function onResize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
function b64ToBuffer(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}

function loadModel(buf){
  new THREE.GLTFLoader().parse(buf,"",gltf=>{
    if(root) scene.remove(root);
    root=new THREE.Group(); model=gltf.scene; root.add(model); scene.add(root);
    bones={}; skeleton=null; headMesh=null; detailMesh=null;
    model.traverse(o=>{
      if(o.isSkinnedMesh){ skeleton=skeleton||o.skeleton; o.castShadow=true; o.receiveShadow=true; o.frustumCulled=false;
        if(o.name==="Head") headMesh=o; if(o.name==="HeroDetail"){detailMesh=o;o.castShadow=false} }
      if(o.isBone) bones[o.name]=o;
    });

function updateFace(d,spd,onFloor,vy,action){
  if(!headMesh||!headMesh.morphTargetDictionary) return;
  state.runT=spd>4.5?state.runT+d:Math.max(0,state.runT-d*2);
  let want="";
  if(state.emoteT>0){state.emoteT-=d;want=state.emote}
  else if(state.autoFace){ if(action==="aim")want="focus"; else if(!onFloor&&vy<-4)want="surprise"; else if(state.runT>18)want="tired" }
  FACES.forEach(n=>{
    const auto=n===want?(n==="smile"?1:0.85):0, man=state.faceManual[n], tgt=Math.max(auto,man);
    state.exprCur[n]=lerp(state.exprCur[n]||0,tgt,clamp(d*6,0,1));
    const i=headMesh.morphTargetDictionary[n]; if(i!==undefined) headMesh.morphTargetInfluences[i]=state.exprCur[n];
  });
}
function updatePack(d,onFloor,vy,turn){
  const b=bones.pack; if(!b) return;
  let acc=vy-state.prevVy; if(!onFloor) acc+=18*d; state.prevVy=vy;
  state.packV+=clamp(-acc*0.6,-0.5,0.5); state.packV+=(-state.packX*90-state.packV*11)*d;
  state.packX=clamp(state.packX+state.packV*d,-0.05,0.05);

/* قبضة بيدين: اليد اليمنى (من الحركة) تمسك الأداة، واليسرى تُحلّ بالـIK لتصل إلى المقبض؛ وكذلك اليدان معًا للحجر المحمول */
const ikState={wL:0,wR:0,tL:new THREE.Vector3(),tR:new THREE.Vector3()}, armLen={};
function ikArm(side,target,w){
  const sh=bones["sh"+side],el=bones["el"+side],hand=bones["hand"+side]; if(!sh||!el||!hand||!isFinite(target.x+target.y+target.z)) return;
  if(!armLen[side]) armLen[side]=[el.position.length(),hand.position.length()];
  const sc=(root.scale.x+root.scale.y)*0.5, L1=armLen[side][0]*sc, L2=armLen[side][1]*sc;
  const S=sh.getWorldPosition(new THREE.Vector3()), rq=root.getWorldQuaternion(new THREE.Quaternion());
  const pole=new THREE.Vector3(side==="L"?0.7:-0.7,-1,-0.4).applyQuaternion(rq);
  const Sa=[S.x,S.y,S.z], T0=[target.x,target.y,target.z], pa=[pole.x,pole.y,pole.z];
  let res=solveElbow(Sa,T0,L1,L2,pa);
  for(let i=0;i<2;i++){const f=nrm3(sub3(T0,res.E));res=solveElbow(Sa,sub3(T0,mul3(f,0.07*sc)),L1,L2,pa)}   // المعصم أبعد من راحة اليد بـ7 سم

function updateIK(d){

function frame(){
  const d=Math.min(clock.getDelta(),0.05);
  if(!root||!bones.hips){controls.update();renderer.render(scene,camera);return}
  const s=state, aiming=s.action==="aim", locked=false;
  // اتجاه الكاميرا على الأرض
  const fwd=new THREE.Vector3().subVectors(controls.target,camera.position);fwd.y=0;if(fwd.lengthSq()<1e-6)fwd.set(0,0,-1);fwd.normalize();
  const camYaw=Math.atan2(fwd.x,fwd.z);
  // الحركة
  let mx=s.input.x,my=s.input.y;const mag=Math.min(1,Math.hypot(mx,my));
  const top=aiming?(s.crouch?CONFIG.crouchSpeed:CONFIG.runSpeed)*0.5:(s.crouch?CONFIG.crouchSpeed:CONFIG.runSpeed);
  let speed=0,dir=new THREE.Vector3();
  if(mag>0.01){
    const keyMode=s.input.kb; const full=keyMode?(s.shift?CONFIG.runSpeed:CONFIG.walkSpeed):CONFIG.runSpeed*mag;
    speed=Math.min(top,full);
    // الإدخال: x يمين، y أمام. الاتجاه = أمام الكاميرا * y + يمين الكاميرا * x
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    dir.copy(fwd).multiplyScalar(my).add(right.multiplyScalar(-mx)).normalize();
  }
  const onFloor=s.pos.y<=0.0001&&s.vy<=0;
  if(onFloor){s.vy=-1}else s.vy-=CONFIG.gravity*d;
  if(s.jumpReq&&onFloor&&!s.crouch){s.vy=CONFIG.jumpSpeed;s.pos.y=0.001}
  s.jumpReq=false;
  s.pos.addScaledVector(dir,speed*d); s.pos.y=Math.max(0,s.pos.y+s.vy*d); if(s.pos.y===0&&s.vy<0&&!onFloor)s.vy=0;
  const prevH=s.heading;
  if(aiming)s.heading=lerpAngle(s.heading,camYaw,clamp(10*d,0,1));
  else if(speed>0.2)s.heading=lerpAngle(s.heading,Math.atan2(dir.x,dir.z),clamp(10*d,0,1));
  const dyaw=((s.heading-prevH+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  s.turnS=lerp(s.turnS,dyaw/Math.max(d,1e-4),clamp(12*d,0,1));
  s.speed=speed;
  // الحركة والشبكة
  const fl=s.pos.y<=0.0001;
  engine.update(d,{spd:speed,onFloor:fl,vy:s.vy,crouch:s.crouch,action:s.action,carrying:s.carrying,turn:s.turnS,weapon:s.weapon});
  for(const ev of engine.events.splice(0)) if(ev==="step") s.steps=(s.steps||0)+1;
  applyPose();
  root.position.copy(s.pos); root.rotation.y=s.heading;
  root.updateMatrixWorld(true);
  updateWeapons(s.action==="aim",s.carrying,s.action,clamp(d*10,0,1));
  root.updateMatrixWorld(true); updateIK(d); root.updateMatrixWorld(true);
  updatePack(d,fl,s.vy,s.turnS); updateFace(d,speed,fl,s.vy,s.action);
  // الكاميرا
  const head=V3(s.pos.x,s.pos.y+1.0*CONFIG.heightScale,s.pos.z);
  if(s.scope&&aiming){
    root.visible=false; controls.enabled=false;
    camera.fov=lerp(camera.fov,s.weapon==="bow"?28:16,clamp(8*d,0,1)); camera.updateProjectionMatrix();
    const eye=V3(s.pos.x,s.pos.y+1.62*CONFIG.heightScale,s.pos.z);
    camera.position.copy(eye); camera.rotation.set(s.scopePitch+Math.sin(performance.now()/580)*0.0012,s.scopeYaw+Math.sin(performance.now()/900)*0.001,0,"YXZ");
    $("#scope").style.display="block";
  }else{
    root.visible=true; controls.enabled=true; $("#scope").style.display="none";
    camera.fov=lerp(camera.fov,aiming?46:CONFIG.camera.fov,clamp(8*d,0,1)); camera.updateProjectionMatrix();
    const delta=new THREE.Vector3().subVectors(head,controls.target);controls.target.add(delta);camera.position.add(delta);controls.update();
    s.scopeYaw=camYaw+Math.PI; s.scopePitch=0;
  }
  state.sun.position.set(s.pos.x+4,8,s.pos.z+5); state.sun.target.position.copy(s.pos);
  if(detailMesh) detailMesh.visible=camera.position.distanceTo(s.pos)<CONFIG.detailDistance;
  $("#hud").textContent=`السرعة ${speed.toFixed(1)} م/ث  |  الحالة: ${s.action||(fl?(speed>0.3?(speed>4?"جري":"مشي"):"وقوف"):"قفز")}${s.crouch?" +انحناء":""}  |  السلاح: ${s.weapon}${s.scope?" (عدسة)":""}\nخطوات: ${s.steps||0}   |   FPS ${(1/Math.max(d,1e-4)).toFixed(0)}`;
  renderer.render(scene,camera);
}

function bindInput(){
  const keys={};
  const upd=()=>{const x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),y=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    if(x||y){state.input={x:x/Math.hypot(x,y),y:y/Math.hypot(x,y),kb:true}}else if(!joy.active){state.input={x:0,y:0}}};
  addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;keys[e.code]=true;state.shift=e.shiftKey;
    if(e.code==="Space"){state.jumpReq=true;e.preventDefault()} if(e.code==="KeyC")toggle("crouch"); if(e.code==="Digit1")setWeapon("slingshot"); if(e.code==="Digit2")setWeapon("bow"); if(e.code==="Digit3")setWeapon("crossbow"); upd()});
  addEventListener("keyup",e=>{keys[e.code]=false;state.shift=e.shiftKey;upd()});
  const stick=$("#stick"),knob=$("#knob");window.joy=window.joy={active:false};
  const jm=e=>{const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const L=Math.min(1,Math.hypot(dx,dy)/55);const a=Math.atan2(dy,dx);
    dx=Math.cos(a)*L*55;dy=Math.sin(a)*L*55;knob.style.transform=`translate(${dx}px,${dy}px)`;state.input={x:Math.cos(a)*L,y:-Math.sin(a)*L,kb:false}};
  stick.addEventListener("pointerdown",e=>{joy.active=true;stick.setPointerCapture(e.pointerId);jm(e)});
  stick.addEventListener("pointermove",e=>{if(joy.active)jm(e)});
  const end=()=>{joy.active=false;knob.style.transform="";state.input={x:0,y:0}};
  stick.addEventListener("pointerup",end);stick.addEventListener("pointercancel",end);
  $("#jump").addEventListener("pointerdown",()=>state.jumpReq=true);
  // نظرة العدسة بالسحب
  let drag=null;renderer.domElement.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY}});
  addEventListener("pointerup",()=>drag=null);
  addEventListener("pointermove",e=>{if(drag&&state.scope&&state.action==="aim"){state.scopeYaw-=(e.clientX-drag.x)*0.0016;state.scopePitch=clamp(state.scopePitch-(e.clientY-drag.y)*0.0016,-1.2,1.2);drag={x:e.clientX,y:e.clientY}}});
  $("#panelBtn").onclick=()=>{const p=$("#panel");p.style.display=p.style.display==="block"?"none":"block"};
}
function toggle(k){state[k]=!state[k];refreshButtons()}
function setAction(a){state.action=state.action===a?"":a; if(state.action!=="aim")state.scope=false; refreshButtons()}
function setWeapon(w){state.weapon=w;if(w==="slingshot")state.scope=false;refreshButtons()}
function toggleScope(){if(state.action!=="aim"){state.action="aim"}if(state.weapon==="slingshot"){alert("المقلاع لا يدعم العدسة — اختر القوس أو القوس النشاب");return}state.scope=!state.scope;if(state.scope){state.scopeYaw=Math.atan2(-(camera.position.x-controls.target.x),-(camera.position.z-controls.target.z))}refreshButtons()}
function emote(n){state.emote=n;state.emoteT=1.8}
function refreshButtons(){document.querySelectorAll("[data-act]").forEach(b=>b.classList.toggle("on",state.action===b.dataset.act));
  document.querySelectorAll("[data-w]").forEach(b=>b.classList.toggle("on",state.weapon===b.dataset.w));
  document.querySelector("[data-t=crouch]")?.classList.toggle("on",state.crouch);document.querySelector("[data-t=carrying]")?.classList.toggle("on",state.carrying);document.querySelector("[data-t=scope]")?.classList.toggle("on",state.scope)}
function buildPanel(){
  const p=$("#panel");
  const btn=(t,attr,fn)=>`<button class="b" ${attr} onclick="${fn}">${t}</button>`;
  p.innerHTML=`
  <h3>الحالات</h3>
  <div class="row">${btn("قطع شجر",'data-act="chop"',"setAction('chop')")}${btn("جمع حجارة",'data-act="gather"',"setAction('gather')")}${btn("بناء",'data-act="build"',"setAction('build')")}${btn("تصويب",'data-act="aim"',"setAction('aim')")}</div>
  <div class="row">${btn("انحناء (C)",'data-t="crouch"',"toggle('crouch')")}${btn("حمل حجر",'data-t="carrying"',"toggle('carrying')")}${btn("عدسة",'data-t="scope"',"toggleScope()")}${btn("قفز (Space)",'',"state.jumpReq=true")}</div>
  <h3>السلاح (1 · 2 · 3)</h3>
  <div class="row">${btn("مقلاع",'data-w="slingshot"',"setWeapon('slingshot')")}${btn("قوس",'data-w="bow"',"setWeapon('bow')")}${btn("قوس نشاب",'data-w="crossbow"',"setWeapon('crossbow')")}</div>
  <h3>تعابير الوجه</h3>
  <div class="row">${btn("ابتسام",'',"emote('smile')")}${btn("دهشة",'',"emote('surprise')")}${btn("تركيز",'',"emote('focus')")}${btn("خوف",'',"emote('fear')")}${btn("تعب",'',"emote('tired')")}</div>
  ${FACES.map(n=>`<label class="sl"><span>${n}</span><input type="range" min="0" max="1" step="0.01" value="0" oninput="state.faceManual['${n}']=+this.value"></label>`).join("")}
  <label class="sl"><span>تلقائي</span><input type="checkbox" ${state.autoFace?"checked":""} onchange="state.autoFace=this.checked"></label>
  <h3>الألوان</h3>
  <div class="col">${COLOR_GROUPS.map(([k,l])=>`<label><input type="color" id="c_${k}" value="#888888" oninput="setMaterialColor('${k}',this.value)">${l}</label>`).join("")}</div>
  <label class="sl"><span>شعر+لحية</span><input type="color" oninput="setMaterialColor('hair',this.value);setMaterialColor('beard',this.value)"></label>
  <h3>الجسم</h3>
  <label class="sl"><span>الطول</span><input type="range" min="0.85" max="1.15" step="0.01" value="1" oninput="CONFIG.heightScale=+this.value;applyScale()"></label>
  <label class="sl"><span>العرض</span><input type="range" min="0.85" max="1.2" step="0.01" value="1" oninput="CONFIG.widthScale=+this.value;applyScale()"></label>
  <h3>نموذج GLB آخر</h3>
  <input type="file" accept=".glb" onchange="if(this.files[0])this.files[0].arrayBuffer().then(loadModel)">
  <div id="help">تحكم: WASD/الأسهم للمشي، Shift للجري، Space للقفز، C للانحناء، 1/2/3 للسلاح، السحب لتدوير الكاميرا. في الجوال: العصا يسار وزر القفز يمين.<br>للتعديل: افتح الملف في محرر نصوص — الإعدادات في CONFIG أعلى السكربت، والحركة في PoseEngine، والأسلحة في buildProps().</div>`;
  refreshButtons();
}
addEventListener("DOMContentLoaded",init);
</script>
<script id="hero-glb" type="text/plain">__GLB_BASE64__</script>
</body>
</html>
